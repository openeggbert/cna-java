plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.openeggbert'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-parameters', '-Xlint:all', '-Werror'])
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

test {
    useJUnitPlatform()
}

def hostOs = org.gradle.internal.os.OperatingSystem.current()
def nativeLibraryName = hostOs.isWindows() ? 'cna_java_jni.dll' :
        (hostOs.isMacOsX() ? 'libcna_java_jni.dylib' : 'libcna_java_jni.so')
def nativeOutput = layout.buildDirectory.file("native/${nativeLibraryName}")
// The authoritative native development dependency is the sibling `cnanext` checkout.
// CNA_ROOT overrides it explicitly; there is deliberately no fallback to an unrelated
// historical CNA checkout, because qualifying against one would make every ABI, symbol
// and layout result in this build describe a library nobody ships.
def cnaNextDirectory = rootProject.file('../../cnanext')
def configuredCnaRoot = providers.environmentVariable('CNA_ROOT').orElse(
        providers.provider {
            if (!new File(cnaNextDirectory, 'modules/c-api/include/CNA/C/cna.h').isFile()) {
                throw new GradleException(
                        'CNA C API headers not found at ' + cnaNextDirectory.absolutePath +
                        '. Set CNA_ROOT to a CNA checkout that provides ' +
                        'modules/c-api/include/CNA/C/cna.h.')
            }
            cnaNextDirectory.absolutePath
        })

tasks.register('compileJni', Exec) {
    group = 'build'
    description = 'Builds the Java 17 JNI adapter against CNA stable C headers.'
    // Every source under src/main/c, not just the translation unit: the adapter includes
    // hand-written and generated .inc files, and a stale library is worse than a slow rebuild.
    inputs.dir('src/main/c')
    inputs.dir(configuredCnaRoot.map { file("${it}/modules/c-api/include") })
    outputs.file(nativeOutput)
    doFirst {
        def javaHome = file(System.getProperty('java.home'))
        def osInclude = hostOs.isWindows() ? 'win32' : (hostOs.isMacOsX() ? 'darwin' : 'linux')
        def compiler = System.getenv('CC') ?: 'cc'
        def arguments = [
                compiler, '-std=c11', '-Wall', '-Wextra', '-Werror', '-fPIC', '-shared',
                "-I${new File(javaHome, 'include')}",
                "-I${new File(javaHome, "include/${osInclude}")}",
                "-I${file("${configuredCnaRoot.get()}/modules/c-api/include")}",
                '-o', nativeOutput.get().asFile,
                file('src/main/c/cna_java_jni.c')
        ]
        if (!hostOs.isWindows()) {
            arguments.add('-ldl')
        }
        commandLine arguments
    }
}

test {
    dependsOn tasks.named('compileJni')
    systemProperty 'cna.java.jniLibrary', nativeOutput.get().asFile.absolutePath
    // Both native libraries are inputs, not just paths handed over as properties. A rebuilt
    // libcna_c_api changes no Java class and no property value, so without this Gradle calls
    // the suite up to date and reports the previous run's results against a different library
    // -- which is how an ABI migration once looked green while every native test would have
    // failed.
    inputs.file(nativeOutput).withPropertyName('jniLibrary')
    if (System.getenv('CNA_NATIVE_LIBRARY')) {
        systemProperty 'cna.native.library', System.getenv('CNA_NATIVE_LIBRARY')
        inputs.file(file(System.getenv('CNA_NATIVE_LIBRARY')))
                .withPropertyName('cnaLibrary')
    }
    // The CNA checkout the build already qualifies against. A test that needs an authored
    // asset -- an XNA 4.0 .xnb no fixture generator can honestly stand in for -- reads it from
    // there and skips itself when it is absent, rather than copying someone else's asset in.
    systemProperty 'cna.root', configuredCnaRoot.get()
}

sourceSets {
    compileProbe {
        java.srcDir 'src/compileProbe/java'
        compileClasspath += sourceSets.main.output
    }
}

tasks.named('compileCompileProbeJava') {
    dependsOn tasks.named('classes')
}

tasks.register('leakGuard', Exec) {
    group = 'verification'
    dependsOn tasks.named('classes')
    commandLine 'python3', 'tools/api-compat/verify.py', '--leak-only',
            '--target', sourceSets.main.output.classesDirs.asPath
}

tasks.register('apiCompatToolTests', Exec) {
    group = 'verification'
    description = 'Runs mapping/verifier regression tests without XNA assemblies.'
    commandLine 'python3', 'tools/api-compat/test_verify.py'
}

def xnaReferenceDirectory = providers.environmentVariable('XNA_REFERENCE_DIR')

// One task pair per XNA profile. `apiCompat*` keeps naming the selected seven-assembly
// Windows runtime profile so its zero-diagnostic result stays a regression gate, and
// `apiCompatFull*` measures the complete original XNA 4.0 runtime superset, including the
// GamerServices, Net and Avatar assemblies the selected profile omits.
def registerApiCompatTasks = { String suffix, String profile, String describes ->
    tasks.register("apiCompat${suffix}Report", Exec) {
        group = 'verification'
        description = "Reports ${describes} Java projection differences."
        dependsOn tasks.named('classes')
        doFirst {
            if (!xnaReferenceDirectory.isPresent()) {
                throw new GradleException('Set XNA_REFERENCE_DIR to the pinned XNA 4.0 reference assemblies.')
            }
            commandLine 'python3', 'tools/api-compat/verify.py',
                    '--profile', profile,
                    '--reference-dir', xnaReferenceDirectory.get(),
                    '--target', sourceSets.main.output.classesDirs.asPath,
                    '--report-only', '--summary-only'
        }
    }
    tasks.register("apiCompat${suffix}Check", Exec) {
        group = 'verification'
        description = "Strict completeness gate for ${describes}."
        dependsOn tasks.named('classes')
        doFirst {
            if (!xnaReferenceDirectory.isPresent()) {
                throw new GradleException('Set XNA_REFERENCE_DIR to the pinned XNA 4.0 reference assemblies.')
            }
            commandLine 'python3', 'tools/api-compat/verify.py',
                    '--profile', profile,
                    '--reference-dir', xnaReferenceDirectory.get(),
                    '--target', sourceSets.main.output.classesDirs.asPath,
                    '--summary-only'
        }
    }
}

registerApiCompatTasks('', 'tools/api-compat/profiles/xna40-windows-runtime.json',
        'the selected XNA 4.0 Windows runtime profile')
registerApiCompatTasks('Full', 'tools/api-compat/profiles/xna40-full-runtime.json',
        'the complete XNA 4.0 runtime superset')

tasks.register('nativeAbiCheck', Exec) {
    group = 'verification'
    description = 'Verifies the bound native surface against the live CNA C headers.'
    doFirst {
        def arguments = ['python3', 'tools/native-abi/verify.py',
                         '--cna-root', configuredCnaRoot.get()]
        if (System.getenv('CNA_NATIVE_LIBRARY')) {
            arguments.addAll(['--library', System.getenv('CNA_NATIVE_LIBRARY')])
        }
        commandLine arguments
    }
}

tasks.register('nativeCoverageCheck', Exec) {
    group = 'verification'
    description = 'Requires every canonical CNA C API function to carry an explicit classification.'
    doFirst {
        commandLine 'python3', 'tools/native-abi/coverage.py',
                '--cna-root', configuredCnaRoot.get(),
                '--check'
    }
}

tasks.register('nativeCoverageReport', Exec) {
    group = 'verification'
    description = 'Writes the machine-readable CNA C API coverage report.'
    doFirst {
        commandLine 'python3', 'tools/native-abi/coverage.py',
                '--cna-root', configuredCnaRoot.get(),
                '--output', layout.buildDirectory.file('cna-c-api-coverage.json').get().asFile.absolutePath,
                '--summary-output', 'docs/cna-c-api-coverage-summary.json'
    }
}

tasks.register('generateJni', Exec) {
    group = 'build'
    description = 'Regenerates the JNI adapter and Java declarations from the live CNA C headers.'
    doFirst {
        commandLine 'python3', 'tools/native-abi/generate_jni.py',
                '--cna-root', configuredCnaRoot.get()
    }
}

tasks.register('generateJniCheck', Exec) {
    group = 'verification'
    description = 'Fails when the committed generated native boundary is stale.'
    doFirst {
        commandLine 'python3', 'tools/native-abi/generate_jni.py',
                '--cna-root', configuredCnaRoot.get(),
                '--check'
    }
}

tasks.register('nativeAbiToolTests', Exec) {
    group = 'verification'
    description = 'Runs native-boundary tool regression and negative-mutation tests.'
    doFirst {
        commandLine 'python3', 'tools/native-abi/test_verify.py',
                '--cna-root', configuredCnaRoot.get()
    }
}

check {
    dependsOn tasks.named('apiCompatToolTests')
    dependsOn tasks.named('compileCompileProbeJava')
    dependsOn tasks.named('leakGuard')
    dependsOn tasks.named('nativeAbiCheck')
    dependsOn tasks.named('nativeAbiToolTests')
    dependsOn tasks.named('nativeCoverageCheck')
    dependsOn tasks.named('generateJniCheck')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'CNA Java'
                description = 'Java projection of XNA 4.0 backed by the CNA stable C ABI'
                url = 'https://github.com/openeggbert/cna-java'
                licenses {
                    license {
                        name = 'Microsoft Public License'
                        url = 'https://opensource.org/license/ms-pl-html'
                    }
                }
            }
        }
    }
}
